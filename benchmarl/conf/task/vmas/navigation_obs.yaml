defaults:
  - vmas_navigation_obs_config
  - _self_

max_steps: 200

# Number of agents (total = holonomic + diff_drive + car)
n_agents_holonomic: 3
n_agents_diff_drive: 0
n_agents_car: 0

# Number of obstacles
n_obstacles: 3

# World spawning area
world_spawning_x: 1.0
world_spawning_y: 1.0

# Lidar sensor configuration
lidar_range: 0.3
n_lidar_rays: 12

# Reward configuration
shared_rew: False
final_reward: 0.01
agent_collision_penalty: -2.0

# Agent geometry
agent_radius: 0.1

# Rendering (communication lines range, 0 = disabled)
comms_rendering_range: 0