defaults:
  - _self_

max_steps: 400

# Number of agents
n_agents: 3

# Static obstacles
n_static_obstacles: 2
static_obstacle_radius: 0.15

# Dynamic obstacles
n_dynamic_obstacles: 0
dynamic_obstacle_radius: 0.1
dynamic_obstacle_modes:
  - linear
  - circular

# Dynamic obstacle parameters
obstacle_speed: 0.02
obstacle_linear_range: 0.5
obstacle_circular_radius: 0.3
obstacle_random_noise: 0.1

# World spawning area
world_spawning_x: 1.0
world_spawning_y: 1.0

# Lidar sensor configuration
lidar_range: 0.3
n_lidar_rays: 12

# Reward configuration
shared_rew: False
final_reward: 0.01
agent_collision_penalty: -2.0
obstacle_collision_penalty: -1.0

# Agent geometry
agent_radius: 0.1

# Rendering
comms_rendering_range: 0
